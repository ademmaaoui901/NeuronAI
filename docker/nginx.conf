# =============================================================================
# AI Production Agent - Nginx Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Main Configuration
# -----------------------------------------------------------------------------
user nginx;
worker_processes auto;

# -----------------------------------------------------------------------------
# Events
# -----------------------------------------------------------------------------
events {
    worker_connections 1024;
}

# -----------------------------------------------------------------------------
# HTTP
# -----------------------------------------------------------------------------
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript image/svg+xml;

    # ---------------------------------------------------------------------------
    # Upstream
    # ---------------------------------------------------------------------------
    upstream ai_agent_api {
        server api:8000;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # Server
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # Redirect to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name localhost;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # API Proxy
        location / {
            proxy_pass http://ai_agent_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_redirect off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Static Files
        location /static/ {
            alias /app/storage/outputs/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Health Check
        location /health {
            proxy_pass http://ai_agent_api/health;
        }
    }
}
